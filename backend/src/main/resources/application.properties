# Nome do aplicativo, serve de etiqueta pra aparecer nas mensagens do console.
spring.application.name=backend
# Faz o spring ler o "application-local.properties". Serve para guardar o login do servidor MySQL em um arquivo a parte.
spring.profiles.active=local
# "validate" confere se as classes Java batem com as tabelas.
spring.jpa.hibernate.ddl-auto=validate
